name: agro_bharat
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  firebase_core: ^2.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: MuktaLatin
      fonts:
        - asset: assets/fonts/mukta_regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: MuktaMalar
      fonts:
        - asset: assets/fonts/mukta_malar.ttf
    - family: MuktaVaani
      fonts:
        - asset: assets/fonts/mukta_vaani.ttf
    - family: MuktaMahee
      fonts:
        - asset: assets/fonts/mukta_mahee.ttf
