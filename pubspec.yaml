name: agro_bharat
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.2
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  intl: ^0.19.0
  googleapis: ^13.1.0
  googleapis_auth: ^1.6.0
  http: ^1.2.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^17.2.1+1
  flutter_map: ^6.1.0
  geolocator: ^11.1.0
  latlong2: ^0.9.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^2.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/images/

  fonts:
    - family: MuktaLatin
      fonts:
        - asset: assets/fonts/mukta_regular.ttf
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
    - family: MuktaMalar
      fonts:
        - asset: assets/fonts/mukta_malar.ttf
    - family: MuktaVaani
      fonts:
        - asset: assets/fonts/mukta_vaani.ttf
    - family: MuktaMahee
      fonts:
        - asset: assets/fonts/mukta_mahee.ttf
